
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Precious ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #060208;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Poppins', Arial, sans-serif;
}

h1 {
    color: #ff477e;
    
    
    font-size: clamp(17px, 3vw, 28px);
    text-align: center;
    text-shadow: 0 0 15px #ff2e63;
}

p {
    color: #ffd1dc;
        
    text-align: center;
    font-size: 13px;
}

canvas {
    margin-top: 10px;
    width: min(700px, 98vw);
    height: auto;
    display: block;
    filter: drop-shadow(0 0 18px rgba(213, 255, 46, 0.22));
}
</style>
</head>

<body>

<h1>To Someone More Precious Than Anything "MARWA fr sure" ❤️</h1>
<p>A little universe made just for you  ✨</p>

<canvas id="heart" width="800" height="700"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const W = 800;
const H = 700;

const phrases = [
    "My precious one", "My sunshine", "My marwa",
    "My princess", "My little star", "So precious",
    "Endless love", "My beautiful world", "My treasure",
    "Forever special", "Sweet angel", "You are amazing",
    "My favorite person", "Pure happiness", "My heart",
    "Sending kisses", "One of a kind", "Always special",
    "You deserve the world", "My sweetest dream",
    "Endless tenderness", "My little sunshine", "So beautiful",
    "A precious soul", "You make me smile", "My universe",
    "A heart full of love", "Simply wonderful", "My angel",
    "Precious memories", "Infinite sweetness", "You are magic",
    "My lovely star", "A rare treasure", "All things beautiful",
    "❤️", "💕", "✨"
];

// Heart coordinates
function heartPoint(t) {
    return {
        x: 400 + 15 * 16 * Math.pow(Math.sin(t), 3),
        y: 355 - 15 * (
            13 * Math.cos(t)
            - 5 * Math.cos(2*t)
            - 2 * Math.cos(3*t)
            - Math.cos(4*t)
        )
    };
}

const outline = [];

for (let t = 0; t <= Math.PI * 2; t += 0.015) {
    outline.push(heartPoint(t));
}

// Point-in-heart test
function insideHeart(x, y) {
    let inside = false;

    for (let i = 0, j = outline.length - 1;
         i < outline.length; j = i++) {

        const a = outline[i];
        const b = outline[j];

        if (
            ((a.y > y) !== (b.y > y)) &&
            (x < (b.x - a.x) * (y - a.y) /
            (b.y - a.y) + a.x)
        ) {
            inside = !inside;
        }
    }

    return inside;
}

// Fill the heart with evenly spaced words
const particles = [];
const spacingX = 48;
const spacingY = 22;

for (let y = 70; y < 650; y += spacingY) {
    for (let x = 65; x < 740; x += spacingX) {

        const px = x + (Math.random() - 0.5) * 12;
        const py = y + (Math.random() - 0.5) * 5;

        if (insideHeart(px, py)) {
            particles.push({
                x: px,
                y: py,
                text: phrases[
                    Math.floor(Math.random() * phrases.length)
                ],
                size: 7.5 + Math.random() * 2.5,
                phase: Math.random() * Math.PI * 2,
                delay: Math.random() * 2.5
            });
        }
    }
}

const start = performance.now();

function draw() {
    const time = (performance.now() - start) / 1000;

    ctx.clearRect(0, 0, W, H);

    // Glowing heart outline
    ctx.beginPath();

    outline.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });

    ctx.closePath();
    ctx.strokeStyle = "#ff477e";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#ff2e63";
    ctx.shadowBlur = 14 + Math.sin(time * 2) * 5;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Animated words
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    particles.forEach(p => {
        const progress = Math.min(
            1, Math.max(0, (time - p.delay) / 1.3)
        );

        if (progress <= 0) return;

        const shimmer =
            0.72 + Math.sin(time * 2 + p.phase) * 0.25;

        ctx.globalAlpha = progress * shimmer;
        ctx.font = `600 ${p.size}px Poppins, Arial`;
        ctx.fillStyle = Math.sin(time + p.phase) > 0
            ? "#ff8eb3"
            : "#ff477e";

        ctx.fillText(
            p.text,
            p.x,
            p.y + Math.sin(time * 1.4 + p.phase) * 1.5,
            47
        );
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
